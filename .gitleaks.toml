title = "DeCave Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Known non-secret browser preference setting key; exact path and line only"
  condition = "AND"
  regexTarget = "line"
  paths = ["^src/app/settings-storage\\.ts$"]
  regexes = ["\\Qexport const MUTED_HUBS_KEY = \"decave_muted_hubs_v1\";\\E"]

  [[rules.allowlists]]
  description = "Known non-secret browser notification setting key; exact path and line only"
  condition = "AND"
  regexTarget = "line"
  paths = ["^src/app/settings-storage\\.ts$"]
  regexes = ["\\Qexport const NOTIFICATION_SETTINGS_KEY = \"vadrion_notifications_v1\";\\E"]

  [[rules.allowlists]]
  description = "Known non-secret R2 object locator copied from an owned attachment record; exact path and line only"
  condition = "AND"
  regexTarget = "line"
  paths = ["^worker/HubRoom\\.ts$"]
  regexes = ["\\Q        attachmentKey = ownedAttachment.r2_key;\\E"]

  [[rules.allowlists]]
  description = "The same two setting keys where they lived in src/App.tsx before the settings-storage split (history only); exact path and lines only"
  condition = "AND"
  regexTarget = "line"
  paths = ["^src/App\\.tsx$"]
  regexes = [
    "\\Qconst MUTED_HUBS_KEY = \"decave_muted_hubs_v1\";\\E",
    "\\Qconst NOTIFICATION_SETTINGS_KEY = \"vadrion_notifications_v1\";\\E",
  ]

  [[rules.allowlists]]
  description = "Upstream node-forge documentation examples and PKCS#12 API alias in the vendored security patch; exact paths and lines only"
  condition = "AND"
  regexTarget = "line"
  paths = ["^vendor/node-forge/README\\.md$", "^vendor/node-forge/lib/pkcs12\\.js$"]
  regexes = [
    "\\Qvar password = 'Mai9ohgh6ahxee0jutheew0pungoozil';\\E",
    "\\Qvar bags = p12.getBags({localKeyIdHex: '7b59377ff142d0be4565e9ac3d396c01401cd879'});\\E",
    "\\Qp12.generateKey = forge.pbe.generatePkcs12Key;\\E",
  ]